<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Root Cause</title>
<meta name="description" content="A one-hour team investigation of a fictional cyber incident, covering phishing, log analysis, cryptography, secure code and machine learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* =====================================================================
   ROOT CAUSE: a cyber incident investigation for Year 12/13 students
   Everything runs in the browser. No logins, no data leaves the device.
   To customise for your university, edit the CONFIG block in the script.
   ===================================================================== */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#161C27; --muted:#586275;
  --line:#D3D9E3; --accent:#2F4BD8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FD;
  --ok:#23794A; --ok-soft:#DDF1E4; --warn:#8F5C00; --warn-soft:#FBEFD6; --bad:#B3261E; --bad-soft:#FBE3E1;
  --code-bg:#EEF1F6; --plot-grid:#E1E6EE;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E121A; --surface:#151B26; --surface-2:#1C2432; --ink:#E4E8F0; --muted:#97A1B3;
    --line:#2A3345; --accent:#8196FF; --accent-ink:#0E121A; --accent-soft:#1F2A52;
    --ok:#5CC98A; --ok-soft:#16301F; --warn:#E3AE4C; --warn-soft:#33280F; --bad:#F08A82; --bad-soft:#3A1A18;
    --code-bg:#0B0F16; --plot-grid:#232B3A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E121A; --surface:#151B26; --surface-2:#1C2432; --ink:#E4E8F0; --muted:#97A1B3;
  --line:#2A3345; --accent:#8196FF; --accent-ink:#0E121A; --accent-soft:#1F2A52;
  --ok:#5CC98A; --ok-soft:#16301F; --warn:#E3AE4C; --warn-soft:#33280F; --bad:#F08A82; --bad-soft:#3A1A18;
  --code-bg:#0B0F16; --plot-grid:#232B3A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.75rem;font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.88em}
.label{font-family:var(--f-display);font-stretch:80%;font-weight:700;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:.4em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.55em 1em;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:.95rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:.5em}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.55em .7em;width:100%;max-width:100%}
input[type=text]:focus,select:focus{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.stack{display:flex;flex-direction:column;gap:1rem}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* ---------- Top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:1rem;padding-block:.6rem;flex-wrap:wrap}
.mark{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:baseline;gap:.6rem}
.mark .inc{font-family:var(--f-mono);font-size:.72rem;font-weight:400;letter-spacing:0;color:var(--muted);text-transform:none}
.bar .meta{margin-left:auto;display:flex;gap:1.25rem;align-items:center;font-variant-numeric:tabular-nums}
.meta .k{display:block;font-size:.68rem}
.meta .v{font-family:var(--f-mono);font-weight:600;font-size:1rem}

/* ---------- Start screen ---------- */
.ticket{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:2rem;padding-block:2.5rem 3rem}
.ticket-head{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center;margin-bottom:1rem}
.pill{display:inline-flex;align-items:center;gap:.35em;font-family:var(--f-display);font-stretch:80%;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:.25em .65em;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.sev{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.lede{font-size:1.12rem;max-width:62ch;margin-top:1rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.25rem;margin-top:1.5rem;font-size:.95rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.steps-list li{display:grid;grid-template-columns:2rem 1fr;gap:.5rem;align-items:baseline}
.steps-list .n{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.small{font-size:.88rem}

/* ---------- Case layout ---------- */
.case{display:grid;grid-template-columns:250px minmax(0,1fr);gap:2rem;padding-block:1.75rem 3rem}
.rail{display:flex;flex-direction:column;gap:.25rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.rail button{all:unset;display:grid;grid-template-columns:1.8rem 1fr;gap:.5rem;align-items:start;padding:.6rem .7rem;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.rail button:focus-visible{outline:3px solid var(--accent)}
.rail button[aria-current="step"]{background:var(--surface);border-color:var(--line)}
.rail button:disabled{cursor:not-allowed;opacity:.5}
.rail .dot{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.rail .done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.rail .skipped .dot{background:var(--surface-2);border-style:dashed}
.rail [aria-current="step"] .dot{border-color:var(--accent);color:var(--accent)}
.rail .t{font-weight:600;font-size:.95rem;line-height:1.25}
.rail .s{font-size:.78rem;color:var(--muted)}
.rail .sep{height:1px;background:var(--line);margin:.5rem 0}

.stage-head{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.25rem}
.stage-head p{max-width:68ch}
.brief{border-left:3px solid var(--accent);padding:.25rem 0 .25rem 1rem;max-width:70ch;color:var(--ink)}
.task{margin-top:1.5rem}
.task h3{margin-bottom:.6rem}
.feedback{padding:.7rem .9rem;border-radius:var(--r);font-size:.95rem}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.info{background:var(--accent-soft);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.hintbox{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:.7rem .9rem;font-size:.95rem}
.hintbox b{color:var(--warn)}
.confirm{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.9rem}

/* ---------- Stage 1: inbox ---------- */
.inbox{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;min-height:420px}
.mlist{border-right:1px solid var(--line);display:flex;flex-direction:column}
.mlist button{all:unset;cursor:pointer;padding:.7rem .9rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.1rem}
.mlist button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.mlist button[aria-selected="true"]{background:var(--accent-soft)}
.mlist .from{font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:.5rem}
.mlist .time{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:400}
.mlist .subj{font-size:.88rem}
.mlist .flagged{color:var(--bad);font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.mview{padding:1.25rem;display:flex;flex-direction:column;gap:1rem;min-width:0}
.mhead{display:flex;flex-direction:column;gap:.2rem;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.mhead h3{font-family:var(--f-body);font-stretch:100%;font-size:1.1rem}
.addr{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);word-break:break-all}
.mbody{display:flex;flex-direction:column;gap:.8rem;font-size:.95rem;max-width:62ch}
.mbody .fakelink{color:var(--accent);text-decoration:underline;cursor:pointer;word-break:break-all;background:none;border:0;padding:0;font:inherit;text-align:left}
.mbody .cta{align-self:flex-start;background:#1F5FBF;color:#fff;border:0;padding:.6em 1.1em;border-radius:4px;font-weight:600;cursor:pointer}
.linkpeek{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2);border-radius:4px;padding:.4rem .6rem;word-break:break-all}
.logo-chip{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f-display);font-weight:800;font-stretch:80%;letter-spacing:.05em;font-size:.9rem;color:#2C6E63}
.logo-chip i{width:18px;height:18px;border-radius:3px;background:#2C6E63;display:inline-block}
.attach{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:4px;padding:.35rem .6rem;font-size:.85rem;align-self:flex-start}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.check{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:.93rem}
.check input{margin-top:.25rem;accent-color:var(--accent)}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* ---------- Stage 2: logs ---------- */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.log{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums;min-width:780px}
.log th{font-family:var(--f-display);font-stretch:80%;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;text-align:left;color:var(--muted);font-weight:700;padding:.55rem .7rem;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.log td{padding:.45rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
.log tr:last-child td{border-bottom:0}
.log tr.hl td{background:var(--warn-soft)}
.log tbody tr{cursor:pointer}
.res{font-weight:600}
.res.s{color:var(--ok)} .res.f{color:var(--bad)} .res.i{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.6rem}
.filters select{width:auto}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.q label.label{display:block;margin-bottom:.35rem}
.radios{display:flex;flex-direction:column;gap:.45rem}
.radio{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:.93rem}
.radio input{margin-top:.25rem;accent-color:var(--accent)}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* ---------- Stage 3: crypto ---------- */
.cipherbox{font-family:var(--f-mono);font-size:.85rem;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;word-break:break-all;line-height:1.6}
.tool{display:grid;gap:.75rem}
.shift{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.shift input[type=range]{flex:1;min-width:180px;accent-color:var(--accent)}
.shift .val{font-family:var(--f-mono);font-weight:600;font-size:1.3rem;min-width:3ch;text-align:right}
.freq{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:2px;align-items:end;height:130px;padding-top:.5rem}
.freq .col{display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.freq .b{width:100%;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.freq .b.eng{background:var(--muted);opacity:.45}
.freq .pair{display:flex;gap:1px;align-items:flex-end;width:100%;height:100%}
.freq .pair .b{flex:1}
.freq .l{font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.legend{display:flex;gap:1rem;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:2px;vertical-align:-1px;margin-right:.3rem}

/* ---------- Stage 4: code ---------- */
.code{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.7}
.code ol{list-style:none;margin:0;padding:.5rem 0;min-width:600px}
.code li{display:grid;grid-template-columns:3rem 1fr;cursor:pointer;white-space:pre;border-left:3px solid transparent}
.code li:hover{background:var(--surface-2)}
.code li[aria-pressed="true"]{background:var(--bad-soft);border-left-color:var(--bad)}
.code li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.code .ln{color:var(--muted);text-align:right;padding-right:1rem;user-select:none}
.code .kw{color:var(--accent);font-weight:600}
.code .str{color:var(--ok)}
.code .cm{color:var(--muted);font-style:italic}
.fixes{display:flex;flex-direction:column;gap:1.25rem}

/* ---------- Stage 5: ML ---------- */
.ml{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.plotbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.5rem}
canvas{display:block;width:100%;height:auto;max-width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .9rem}
.stat .n{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat.good{border-color:var(--ok)} .stat.good .n{color:var(--ok)}
.stat.badc{border-color:var(--bad)} .stat.badc .n{color:var(--bad)}
.thr input{width:100%;accent-color:var(--accent)}
.keyline{display:flex;flex-wrap:wrap;gap:1rem;font-size:.82rem;color:var(--muted);padding:.25rem .5rem}
.keyline span{display:inline-flex;align-items:center;gap:.35rem}
.sw{width:.75rem;height:.75rem;display:inline-block}
.sw.c{border-radius:50%;background:var(--muted)}
.sw.x{background:var(--bad);clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%)}
.sw.r{border:2px solid var(--warn);border-radius:50%}

/* ---------- Timeline ---------- */
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.order li{display:grid;grid-template-columns:2rem 1fr auto;gap:.75rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .7rem}
.order .n{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.mv{display:inline-flex;gap:.3rem}
.mv .btn{padding:.3em .6em}

/* ---------- Passwords ---------- */
.hashpair{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.hash{font-family:var(--f-mono);font-size:.78rem;word-break:break-all;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:.5rem .6rem;margin-top:.4rem;line-height:1.5}
.hash mark{background:var(--warn-soft);color:var(--warn);font-weight:600;border-radius:2px}
.saltdemo{display:flex;flex-direction:column;gap:.4rem}
.meterline{display:flex;flex-direction:column;gap:.35rem;margin-top:.5rem}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;max-width:420px}
.meter i{display:block;height:100%}
.meter i.bad{background:var(--bad)} .meter i.warn{background:var(--warn)} .meter i.ok{background:var(--ok)}
.rankgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.rankrow{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid var(--line);border-radius:var(--r);padding:.45rem .6rem;background:var(--surface)}
.rankrow select{width:auto}

/* ---------- Firewall ---------- */
table.fw{border-collapse:collapse;width:100%;min-width:620px}
.fw th{font-family:var(--f-display);font-stretch:80%;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;text-align:left;color:var(--muted);padding:.55rem .6rem;border-bottom:1px solid var(--line);background:var(--surface-2)}
.fw td{padding:.4rem .6rem;border-bottom:1px solid var(--line)}
.fw select{width:100%}
.fw tr.off td{color:var(--muted)}
.fw tr.off select{opacity:.6}
.policy{margin:.4rem 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.25rem}

/* ---------- Respond ---------- */
.actions{display:flex;flex-direction:column;gap:.45rem}
.action{display:grid;grid-template-columns:1fr minmax(0,210px);gap:.75rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .7rem}

/* ---------- Report ---------- */
.report{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:2rem}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 1rem 1.25rem}
.timeline li::before{content:"";position:absolute;left:-7px;top:.45rem;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.code-out{font-family:var(--f-mono);font-size:clamp(1.8rem,5vw,2.6rem);font-weight:600;letter-spacing:.08em;color:var(--accent);user-select:all}
.scoretable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.scoretable td{padding:.45rem 0;border-bottom:1px solid var(--line)}
.scoretable td:last-child{text-align:right;font-family:var(--f-mono)}
.scoretable tr.total td{font-weight:700;border-bottom:0}
.careers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.75rem}
.career{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.career .label{color:var(--accent)}

/* ---------- Facilitator ---------- */
.clock{font-family:var(--f-mono);font-weight:600;font-size:clamp(4rem,14vw,9rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.low{color:var(--bad)}
.fac{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem;padding-block:1.75rem 3rem}
.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th{text-align:left;font-family:var(--f-display);font-stretch:80%;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;color:var(--muted);padding:.5rem;border-bottom:1px solid var(--line)}
.lb td{padding:.55rem .5rem;border-bottom:1px solid var(--line)}
.lb td.num{font-family:var(--f-mono);text-align:right}
.lb tr:first-child td{font-weight:700}
.runsheet{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.runsheet li{display:grid;grid-template-columns:5.5rem 1fr;gap:.75rem}

details.prompt summary{cursor:pointer;font-weight:600}

  .ticket,.case,.report,.fac,.ml{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:.35rem;padding-bottom:.25rem}

</style>

</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="mark">Root Cause <span class="inc" id="incId">INC-2026-1013</span></div>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main id="app"></main>

<script>
/* =====================================================================
   CONFIG: edit these values for your institution and session.
   ===================================================================== */
const CONFIG = {
  university: "Your University",
  department: "School of Computing",
  sessionMinutes: 45,            // mission time on the facilitator countdown
  courses: [
    "BSc Computer Science",
    "BSc Cyber Security",
    "BSc Software Engineering",
    "BSc Artificial Intelligence"
  ],
  website: "https://www.example.ac.uk/computing",
  openDay: "Open days run through the autumn and spring. Details are on our website."
};

/* ---------- small helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fnv(s){let h=0x811c9dc5;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,"0")}
const check = (answer, hash) => fnv("rc:" + answer) === hash;   // answers are stored as hashes, not plain text
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- stage definitions ---------- */
const STAGES = [
  { id:"s1", title:"Initial access", sub:"Phishing analysis", topic:"Cyber security",
    hints:[
      "Check the full sender address of every email, not just the display name, and compare it with the company's real domain, tarnvalley.example. Hover over or tap every button to see where it really goes. Two emails are malicious.",
      "The parcel email wants card details, not a work password. For the clues, one tempting option does not appear in the IT email at all, and another is something attackers copy easily."
    ]},
  { id:"s2", title:"Sign-in trail", sub:"Log analysis", topic:"Security operations",
    hints:[
      "Filter the log to results that failed. One burst of failures hits lots of accounts in a few seconds. That is noise. Look for a different pattern: one account, one unfamiliar IP address, a few failures and then a success.",
      "The password was correct every time from the unfamiliar address. What kept failing was the second step. Count the MFA denials before the approval."
    ]},
  { id:"s3", title:"Timeline", sub:"Digital forensics", topic:"Digital forensics",
    hints:[
      "Most events have an exact time in the stage 2 sign-in log or the audit log on this page. The phishing email arrived at 07:41 and Dan entered his password at 07:52.",
      "The password spray from Frankfurt happened before any of the attacker's actions. It was a separate, failed attack."
    ]},
  { id:"s4", title:"The attacker's notes", sub:"Cryptanalysis", topic:"Cryptography",
    hints:[
      "Note 1 ends in a pattern typical of Base64. Decode it first. The result is still scrambled, but spaces and punctuation are in place, so each letter has only been shifted. E is the most common English letter: find the tallest blue bar and count how far it is from E.",
      "For note 2, the keyword is one word: the first word of the supplier whose bank details were already changed (see stage 1 or the sign-in log)."
    ]},
  { id:"s5", title:"How it was possible", sub:"Secure code review", topic:"Software development",
    hints:[
      "Line 21 stores new passwords with hash_password(). Compare that with how sign_in() checks them. One of the three flaws is about MFA, and it matches exactly what you saw in the log.",
      "The third flaw is in create_account(). Ask where the value of role comes from, and whether a user could change it before sending the request."
    ]},
  { id:"s6", title:"Password vault", sub:"Hashing and passwords", topic:"Data protection",
    hints:[
      "Part 1: change one letter in input B and count the highlighted characters. Part 2: identical passwords with no salt always give identical hashes, so look for two rows that match exactly.",
      "Part 3: run all four through the strength checker. A password on the common-password list counts as the weakest, whatever its score."
    ]},
  { id:"s7", title:"Close the door", sub:"Firewall rules", topic:"Networking",
    hints:[
      "The first rule, Allow any address on port 443, matches the attacker before the deny rule below it is ever checked. Specific deny rules need to come before broad allow rules.",
      "One working answer uses four rules: deny each attacker address on any port, allow any address on port 443, and allow only the office network on port 22. Turn off the rule that allows everything."
    ]},
  { id:"s8", title:"Catch it next time", sub:"Machine learning", topic:"Artificial intelligence",
    hints:[
      "Train the model first. At the default 50% threshold, look at which red cross is not ringed. That is the attack being missed.",
      "Lower the threshold slowly and watch both counts. There is a band of values where every attack is caught and only one or two normal sign-ins are flagged."
    ]},
  { id:"s9", title:"Respond", sub:"Incident response plan", topic:"Security management",
    hints:[
      "Four of the actions stop the attacker or protect the money straight away. Two are harmful and should not happen at all.",
      "\"This week\" is for fixing what let the attacker in: the code, the MFA settings and checking for other damage. \"Longer term\" is about people, processes and monitoring."
    ]}
];

const BLANK = () => ({ team:"", started:null, finished:null, current:0, stages:STAGES.map(()=>({hints:0,wrong:0,status:"open",score:0})), ui:{} });
let S = store.get("rootcause.v2.team") || BLANK();
const save = () => store.set("rootcause.v2.team", S);

function stageScore(i){ const st=S.stages[i]; if(st.status==="skipped") return 0; if(st.status!=="done") return 0; return Math.max(40, 100 - 15*st.hints - 10*st.wrong); }
const totalScore = () => S.stages.reduce((a,_,i)=>a+stageScore(i),0);
const unlocked = i => i===0 || S.stages[i-1].status!=="open";
const allClosed = () => S.stages.every(s=>s.status!=="open");

/* ---------- report code: score, minutes and stages, with a checksum ---------- */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function makeCode(score, minutes, mask){
  const p = Math.min(score,1023)*32768 + Math.min(minutes,63)*512 + (mask & 511);
  const c = parseInt(fnv("code:"+p),16) & 255;
  let v = p*256 + c, out = "";
  for(let i=0;i<7;i++){ out = B32[v % 32] + out; v = Math.floor(v/32); }
  return out.slice(0,4) + "-" + out.slice(4);
}
function readCode(str){
  const s = String(str).toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  if(s.length!==7) return null;
  let v = 0; for(const ch of s){ const d=B32.indexOf(ch); if(d<0) return null; v = v*32 + d; }
  const c = v % 256, p = Math.floor(v/256);
  if((parseInt(fnv("code:"+p),16) & 255) !== c) return null;
  return { score:Math.floor(p/32768), minutes:Math.floor(p/512)%64, mask:p%512 };
}

/* ---------- top bar ---------- */
let tick = null;
function fmtTime(ms){ const t=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
function renderMeta(){
  const m = $("#meta");
  if(route==="fac"){ m.innerHTML = `<span class="pill acc">Facilitator view</span>`; return; }
  if(!S.started){ m.innerHTML = ""; return; }
  const elapsed = (S.finished||Date.now()) - S.started;
  m.innerHTML = `
    <div><span class="label k">Team</span><span class="v" style="font-family:var(--f-body)">${esc(S.team)}</span></div>
    <div><span class="label k">Score</span><span class="v">${totalScore()}</span></div>
    <div><span class="label k">Elapsed</span><span class="v" id="elapsed">${fmtTime(elapsed)}</span></div>`;
}
function startTick(){ clearInterval(tick); tick=setInterval(()=>{ const e=$("#elapsed"); if(e && S.started && !S.finished) e.textContent = fmtTime(Date.now()-S.started); },1000); }

/* ---------- routing ---------- */
let route = location.hash === "#facilitator" ? "fac" : "team";
window.addEventListener("hashchange", ()=>{ route = location.hash === "#facilitator" ? "fac" : "team"; render(); });
function render(){
  renderMeta();
  if(route==="fac") return renderFacilitator();
  if(!S.started) return renderStart();
  if(S.ui.view==="report") return renderReport();
  renderCase();
}

/* =====================================================================
   START SCREEN
   ===================================================================== */
function renderStart(){
  $("#app").innerHTML = `
  <div class="wrap ticket">
    <section>
      <div class="ticket-head">
        <span class="pill sev">Severity 2</span>
        <span class="pill warn">Status: investigating</span>
        <span class="label">Tarn Valley Freight · Incident response</span>
      </div>
      <h1>£48,200 went to the wrong bank account.</h1>
      <p class="lede">Tarn Valley Freight, a haulage firm in the Pennines, has just found that a supplier's bank details were changed in its payroll and payments portal on Monday morning. Nobody in Finance made the change. You are the incident response team. Work out how the attacker got in, what they did and what they plan next, then decide how to stop it happening again.</p>
      <dl class="facts">
        <dt>Ticket</dt><dd>INC-2026-1013</dd>
        <dt>Reported by</dt><dd>Priya Shah, Finance Manager</dd>
        <dt>First noticed</dt><dd>Mon 13 Oct 2026, 11:20</dd>
        <dt>Systems</dt><dd>Email, staff sign-in portal, payments</dd>
      </dl>
      <p class="small muted" style="margin-top:1.5rem;max-width:62ch">Tarn Valley Freight and everyone in this case are fictional. Every address uses the reserved <span class="mono">.example</span> domain and documentation IP ranges.</p>
    </section>
    <aside class="stack">
      <div class="panel stack">
        <h3>Your investigation</h3>
        <ol class="steps-list">
          ${STAGES.map((s,i)=>`<li><span class="n">${String(i+1).padStart(2,"0")}</span><span><b>${s.title}</b> <span class="muted small">· ${s.sub}</span></span></li>`).join("")}
        </ol>
        <p class="small muted">Each stage is worth up to 100 points. Hints cost 15 points and wrong answers cost 10, but a solved stage never scores below 40. Stages unlock in order and later stages use evidence from earlier ones. You can skip a stage if you are stuck, but it scores 0. Expect to need most of the session.</p>
      </div>
      <form class="panel stack" id="startForm">
        <div>
          <label class="label" for="teamName">Team name</label>
          <input type="text" id="teamName" maxlength="24" autocomplete="off" placeholder="e.g. Blue Team 4" required>
        </div>
        <button class="btn primary" type="submit">Open the case</button>
      </form>
      <p class="small muted">Running the session? Open the <a href="#facilitator">facilitator view</a> on the projector for the countdown and leaderboard.</p>
    </aside>
  </div>`;
  $("#startForm").addEventListener("submit", e=>{
    e.preventDefault();
    const name = $("#teamName").value.trim();
    if(!name) return;
    S = BLANK(); S.team = name; S.started = Date.now(); save(); render(); startTick();
  });
}

/* =====================================================================
   CASE SHELL
   ===================================================================== */
function renderCase(){
  const i = S.current;
  $("#app").innerHTML = `
  <div class="wrap case">
    <nav class="rail" aria-label="Investigation stages">
      ${STAGES.map((s,k)=>{
        const st=S.stages[k].status;
        return `<button data-go="${k}" class="${st}" ${k===i?'aria-current="step"':''} ${unlocked(k)?'':'disabled'}>
          <span class="dot">${st==="done"?"✓":st==="skipped"?"–":k+1}</span>
          <span><span class="t">${s.title}</span><br><span class="s">${s.sub}${st==="done"?" · "+stageScore(k)+" pts":""}</span></span>
        </button>`;}).join("")}
      <div class="sep"></div>
      <button data-go="report" ${allClosed()?'':'disabled'}><span class="dot">R</span><span><span class="t">Incident report</span><br><span class="s">${allClosed()?"Ready":"Finish all stages"}</span></span></button>
    </nav>
    <section id="stage" aria-live="polite"></section>
  </div>`;
  $(".rail").addEventListener("click", e=>{
    const b = e.target.closest("button[data-go]"); if(!b || b.disabled) return;
    if(b.dataset.go==="report"){ S.ui.view="report"; save(); return render(); }
    S.current = +b.dataset.go; save(); render(); window.scrollTo({top:0});
  });
  [stage1,stage2,stageTimeline,stage3,stage4,stagePw,stageFw,stage5,stageRespond][i]($("#stage"));
}

function stageFrame(i, brief, bodyHtml){
  const s = STAGES[i], st = S.stages[i];
  const hintsShown = s.hints.slice(0, st.hints).map((h,k)=>`<div class="hintbox"><b>Hint ${k+1}.</b> ${h}</div>`).join("");
  const closed = st.status!=="open";
  return `
  <div class="stage-head">
    <span class="label">Stage ${i+1} of ${STAGES.length} · ${s.topic}</span>
    <h2>${s.title}</h2>
    <p class="brief">${brief}</p>
  </div>
  ${bodyHtml}
  <div class="stack" style="margin-top:1rem" id="fbZone"></div>
  ${hintsShown ? `<div class="stack" style="margin-top:1rem">${hintsShown}</div>` : ""}
  <div class="toolbar">
    <div class="row">
      ${!closed && st.hints < s.hints.length ? `<button class="btn" id="hintBtn">Show hint ${st.hints+1} (−15)</button>` : ""}
      ${!closed ? `<span id="skipZone"><button class="btn ghost" id="skipBtn">Skip this stage</button></span>` : ""}
    </div>
    ${closed ? `<button class="btn primary" id="nextBtn">${i<STAGES.length-1?"Next stage →":"Write the incident report →"}</button>` : `<span class="small muted">Worth up to ${Math.max(40,100-15*st.hints-10*st.wrong)} points now</span>`}
  </div>`;
}
function wireFrame(i){
  const hb=$("#hintBtn"); if(hb) hb.onclick=()=>{ S.stages[i].hints++; save(); render(); };
  const sb=$("#skipBtn"); if(sb) sb.onclick=()=>{
    $("#skipZone").innerHTML = `<span class="confirm">Skip and score 0 for this stage? <button class="btn" id="skipYes">Skip</button><button class="btn ghost" id="skipNo">Keep going</button></span>`;
    $("#skipYes").onclick=()=>{ S.stages[i].status="skipped"; advance(i); };
    $("#skipNo").onclick=()=>render();
  };
  const nb=$("#nextBtn"); if(nb) nb.onclick=()=>advance(i, true);
}
function advance(i, move){
  save();
  if(move || S.stages[i].status==="skipped"){
    if(i<STAGES.length-1){ S.current=i+1; } else { finishIfDone(); S.ui.view="report"; }
    save(); render(); window.scrollTo({top:0});
  } else render();
}
function finishIfDone(){ if(allClosed() && !S.finished){ S.finished=Date.now(); save(); } }
function feedback(kind, html){ const z=$("#fbZone"); if(z) z.innerHTML = `<div class="feedback ${kind}">${html}</div>`; }
function wrong(i, html){ S.stages[i].wrong++; save(); renderMeta(); feedback("bad", html + ` <span class="small">(−10)</span>`);
  const w=$(".toolbar .small.muted"); if(w) w.textContent = `Worth up to ${Math.max(40,100-15*S.stages[i].hints-10*S.stages[i].wrong)} points now`; }
function solved(i, html){ S.stages[i].status="done"; S.stages[i].score=stageScore(i); if(i===STAGES.length-1) finishIfDone(); save(); render(); feedback("ok", html); }

/* =====================================================================
   STAGE 1: PHISHING
   ===================================================================== */
const EMAILS = [
  { id:"e1", name:"Priya Shah", addr:"p.shah@tarnvalley.example", time:"Mon 06:52", subj:"Friday payment run moved to 10:00",
    body:`<p>Morning Dan,</p><p>Quick one. The supplier payment run on Friday is moving from 14:00 to 10:00 because the bank cut-off has changed. Can you have the approved list ready by Thursday afternoon?</p><p>Thanks,<br>Priya</p>` },
  { id:"e2", name:"Northfield Pallets Accounts", addr:"accounts@northfieldpallets.example", time:"Mon 07:05", subj:"Invoice NP-20931 as discussed",
    body:`<p>Hi Dan,</p><p>As discussed on the phone on Thursday, please find attached invoice NP-20931 for the October pallet order. Payment terms as usual, 30 days.</p><p>Kind regards,<br>Helen Marsh<br>Northfield Pallets Ltd</p><span class="attach">📄 NP-20931.pdf · 184 KB</span>` },
  { id:"e3", name:"IT Service Desk", addr:"servicedesk@tarnvalley-support.example", time:"Mon 07:41", subj:"Mailbox storage 98% full: action required",
    body:`<span class="logo-chip"><i></i>TARN VALLEY FREIGHT</span><p>Dear user,</p><p>Your mailbox has reached 98% of its storage limit. New messages may be rejected and your account will be suspended if the problem is not resolved.</p><p>To keep your mailbox active, please re-validate your account within <b>2 hours</b> using the secure portal below.</p><button class="cta" data-href="https://tarnvalley-mail-verify.example/login?u=d.okafor">Re-validate mailbox</button><p>Or copy this address into your browser: <button class="fakelink" data-href="https://tarnvalley-mail-verify.example/login?u=d.okafor">https://portal.tarnvalley.example/mailbox</button></p><p>Regards,<br>IT Service Desk<br>Tarn Valley Freight</p>` },
  { id:"e4", name:"Tarn Valley IT", addr:"it-announce@tarnvalley.example", time:"Mon 07:48", subj:"Planned maintenance this Saturday",
    body:`<p>Hello everyone,</p><p>The staff portal will be unavailable on Saturday between 06:00 and 09:00 for planned updates. No action is needed from you.</p><p>A reminder that IT will never ask for your password by email or phone.</p><p>Tarn Valley IT</p>` },
  { id:"e7", name:"DelivR Parcels", addr:"notify@delivr-parcels.example", time:"Mon 07:58", subj:"We couldn't deliver your parcel",
    body:`<p>Hello,</p><p>We tried to deliver your parcel today but nobody was available to sign for it. Your parcel is being held at our depot.</p><p>To arrange redelivery, pay the £1.99 redelivery fee within 24 hours or your parcel will be returned to the sender.</p><button class="cta" data-href="https://delivr-redelivery.example/pay?ref=TV88213">Pay and rebook</button><p>DelivR Customer Care</p>` },
  { id:"e5", name:"Tarn Valley Sign-in", addr:"no-reply@login.tarnvalley.example", time:"Mon 08:04", subj:"New sign-in to your account",
    body:`<p>Your account <b>d.okafor</b> was signed in from a new location.</p><p>Location: Amsterdam, NL<br>Time: Mon 13 Oct, 08:03<br>Device: Unknown</p><p>If this was you, you can ignore this message. If not, contact IT on extension 2200.</p>` },
  { id:"e6", name:"Staff Social Club", addr:"social@tarnvalley.example", time:"Mon 08:15", subj:"Quiz night tickets now on sale",
    body:`<p>Our autumn quiz night is on Friday 24 October at the Drovers Arms. Tickets are £5 and include a pie. Reply to this email to reserve a team table.</p>` }
];
const FLAGS = [
  ["a","The sender's domain is tarnvalley-support.example, not the company's tarnvalley.example"],
  ["b","The link text shows one address, but the link actually goes to a different site"],
  ["c","It threatens suspension unless you act within a short deadline"],
  ["d","It greets you as \"Dear user\" instead of by name"],
  ["e","It contains spelling and grammar mistakes"],
  ["f","It includes the company logo"],
  ["g","It has a suspicious attachment"],
  ["h","It was sent in the middle of the night"]
];
function stage1(el){
  const i=0, st=S.stages[i], ui=S.ui, done=st.status==="done";
  const phase = done ? "clues" : (ui.s1p || "tri");
  const open = ui.s1open || "e1";
  const m = EMAILS.find(x=>x.id===open);
  const tri = ui.s1tri || {};
  const nTri = Object.keys(tri).length;
  const chip = id => { const v = phase==="tri" ? tri[id] : (["e3","e7"].includes(id) ? "sus" : "safe");
    return v==="sus" ? `<span class="pill sev">Suspicious</span>` : v==="safe" ? `<span class="pill ok">Safe</span>` : ""; };
  let task = "";
  if(phase==="tri"){
    task = `<div class="task row"><button class="btn primary" id="s1a" ${nTri===EMAILS.length?"":"disabled"}>Submit triage</button><span class="small muted">${nTri} of ${EMAILS.length} emails sorted. Open each email and mark it safe or suspicious.</span></div>`;
  } else if(phase==="which"){
    task = `<div class="task"><h3>Which suspicious email gave the attacker Dan's portal password?</h3>
      <div class="radios">${["e3","e7"].map(id=>{const x=EMAILS.find(e=>e.id===id);return `<label class="radio"><input type="radio" name="s1w" id="s1w-${id}" value="${id}"><span><b>${x.name}</b> · ${x.subj}</span></label>`}).join("")}</div>
      <div class="row" style="margin-top:1rem"><button class="btn primary" id="s1b">Submit</button></div></div>`;
  } else {
    task = `<div class="task">
      <h3>Which clues gave the IT Service Desk email away?</h3>
      <p class="muted small" style="margin-bottom:.75rem">Tick every clue that applies to this email, and only those.</p>
      <div class="checks">
        ${FLAGS.map(([k,t])=>`<label class="check"><input type="checkbox" id="flag-${k}" value="${k}" ${(ui.s1flags||[]).includes(k)||done&&"abcd".includes(k)?"checked":""} ${done?"disabled":""}><span>${t}</span></label>`).join("")}
      </div>
      ${!done?`<div class="row" style="margin-top:1rem"><button class="btn primary" id="s1c">Submit clues</button></div>`:""}
    </div>`;
  }
  el.innerHTML = stageFrame(i,
    `Dan Okafor in Accounts says he "didn't do anything unusual" on Monday morning. This is his inbox. First sort every email into safe or suspicious. Then work out which one handed the attacker his password, and what should have given it away.`,
    `<div class="inbox">
      <div class="mlist" role="listbox" aria-label="Dan's inbox">
        ${EMAILS.map(x=>`<button role="option" data-mail="${x.id}" aria-selected="${x.id===open}">
          <span class="from"><span>${x.name}</span><span class="time">${x.time}</span></span>
          <span class="subj">${x.subj}</span>
          <span>${chip(x.id)}</span>
        </button>`).join("")}
      </div>
      <article class="mview">
        <div class="mhead">
          <h3>${m.subj}</h3>
          <span><b>${m.name}</b> <span class="addr">&lt;${m.addr}&gt;</span></span>
          <span class="addr">To: d.okafor@tarnvalley.example · ${m.time}</span>
        </div>
        <div class="mbody">${m.body}</div>
        <div id="peek"></div>
        ${phase==="tri" ? `<div class="row"><span class="label">This email is</span>
          <button class="btn" data-tri="safe" aria-pressed="${tri[m.id]==="safe"}">${tri[m.id]==="safe"?"✓ ":""}Safe</button>
          <button class="btn" data-tri="sus" aria-pressed="${tri[m.id]==="sus"}">${tri[m.id]==="sus"?"✓ ":""}Suspicious</button></div>` : ""}
      </article>
    </div>
    ${task}`);
  wireFrame(i);
  el.querySelector(".mlist").addEventListener("click", e=>{ const b=e.target.closest("[data-mail]"); if(!b) return; S.ui.s1open=b.dataset.mail; save(); render(); });
  el.querySelectorAll("[data-href]").forEach(b=>{
    const show=()=>{ $("#peek").innerHTML = `<div class="linkpeek">Link destination: ${esc(b.dataset.href)}</div>`; };

// features: [failed sign-in steps (wrong passwords + rejected MFA prompts), hours from the person's usual sign-in time]
const NORMAL = [[0,.5],[0,1],[1,.5],[0,2],[1,1.5],[0,.2],[2,1],[0,3],[1,2.5],[0,1.2],[3,.8],[1,.3],[0,4],[2,2],[0,.8],[1,3.5],[6,1],[7,.5],[0,9],[0,10],[1,8],[2,6],[4,3],[0,5.5]];
const ATTACK = [[8,7],[10,9],[9,6],[7,10],[6,8],[10,5],[5,9],[3,6.5]];
const DATA = [...NORMAL.map(p=>[p[0],p[1],0]), ...ATTACK.map(p=>[p[0],p[1],1])];
const sig = z => 1/(1+Math.exp(-z));
let ML = { w:[0,0,0], epoch:0, running:false };
function prob(p){ return sig(ML.w[0] + ML.w[1]*p[0]/10 + ML.w[2]*p[1]/12); }
function trainSteps(n){ for(let e=0;e<n;e++){ const g=[0,0,0]; for(const [x,y,l] of DATA){ const p=sig(ML.w[0]+ML.w[1]*x/10+ML.w[2]*y/12)-l; g[0]+=p; g[1]+=p*x/10; g[2]+=p*y/12; } for(let k=0;k<3;k++) ML.w[k]-=0.05*g[k]; ML.epoch++; } }
function mlStats(t){ let tp=0,fp=0; for(const d of DATA){ const f=prob(d)>=t; if(f&&d[2]) tp++; if(f&&!d[2]) fp++; } return {tp,fp}; }
function drawPlot(){
  const c=$("#plot"); if(!c) return;
  const cs=getComputedStyle(document.documentElement);
  const col=v=>cs.getPropertyValue(v).trim();
  const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=Math.round(W*0.72);
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+"px";
  const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const L=44,R=12,T=12,B=40, pw=W-L-R, ph=H-T-B;
  const X=v=>L+v/11*pw, Y=v=>T+ph-v/12*ph;
  g.clearRect(0,0,W,H);
  const t=(S.ui.s5t||50)/100, trained=ML.epoch>0;
  // shaded "flagged" region
  if(trained){
    g.fillStyle=col("--bad-soft");
    const step=4;
    for(let px=0;px<pw;px+=step) for(let py=0;py<ph;py+=step){
      const fx=px/pw*11, fy=(ph-py)/ph*12;
      if(prob([fx,fy])>=t) g.fillRect(L+px,T+py,step,step);
    }
  }
  // grid and axes
  g.strokeStyle=col("--plot-grid"); g.lineWidth=1; g.fillStyle=col("--muted");
  g.font="11px "+col("--f-mono"); g.textAlign="center"; g.textBaseline="top";
  for(let v=0;v<=10;v+=2){ g.beginPath(); g.moveTo(X(v),T); g.lineTo(X(v),T+ph); g.stroke(); g.fillText(v,X(v),T+ph+6); }
  g.textAlign="right"; g.textBaseline="middle";
  for(let v=0;v<=12;v+=3){ g.beginPath(); g.moveTo(L,Y(v)); g.lineTo(L+pw,Y(v)); g.stroke(); g.fillText(v,L-8,Y(v)); }
  g.textAlign="center"; g.textBaseline="bottom"; g.font="600 11px "+col("--f-body");
  g.fillText("Failed sign-in steps (wrong passwords + rejected MFA prompts)", L+pw/2, H-2);
  g.save(); g.translate(11,T+ph/2); g.rotate(-Math.PI/2); g.textBaseline="top"; g.fillText("Hours from usual sign-in time",0,0); g.restore();
  // decision boundary: w0 + w1 x/10 + w2 y/12 = logit(t)
  if(trained && Math.abs(ML.w[2])>1e-6){
    const lg=Math.log(t/(1-t)); const yAt=x=>(lg-ML.w[0]-ML.w[1]*x/10)*12/ML.w[2];
    g.save(); g.beginPath(); g.rect(L,T,pw,ph); g.clip();
    g.strokeStyle=col("--bad"); g.lineWidth=2; g.setLineDash([6,4]);
    g.beginPath(); g.moveTo(X(0),Y(yAt(0))); g.lineTo(X(11),Y(yAt(11))); g.stroke(); g.restore();
  }
  // points
  for(const d of DATA){
    const x=X(d[0]), y=Y(d[1]);
    if(d[2]){ g.strokeStyle=col("--bad"); g.lineWidth=2.5; g.beginPath(); g.moveTo(x-5,y-5); g.lineTo(x+5,y+5); g.moveTo(x+5,y-5); g.lineTo(x-5,y+5); g.stroke(); }
    else { g.fillStyle=col("--muted"); g.beginPath(); g.arc(x,y,4.5,0,Math.PI*2); g.fill(); }
    if(trained && prob(d)>=t){ g.strokeStyle=col("--warn"); g.lineWidth=2; g.beginPath(); g.arc(x,y,9,0,Math.PI*2); g.stroke(); }
  }
}

  $("#resetBtn").onclick=()=>{
    $("#resetZone").innerHTML=`<span class="confirm">This clears this team's progress. <button class="btn" id="resetYes">Clear</button><button class="btn ghost" id="resetNo">Cancel</button></span>`;
    $("#resetYes").onclick=()=>{ store.del("rootcause.v2.team"); S=BLANK(); ML={w:[0,0,0],epoch:0,running:false}; render(); };
    $("#resetNo").onclick=()=>render();
  };
  renderMeta();
}

/* =====================================================================
   FACILITATOR VIEW
   ===================================================================== */
let F = store.get("rootcause.v2.fac") || { remaining: CONFIG.sessionMinutes*60, running:false, endAt:null, teams:[] };
let fTick=null;
const saveF = () => store.set("rootcause.v2.fac", F);
function fRemaining(){ return F.running ? Math.max(0, Math.round((F.endAt-Date.now())/1000)) : F.remaining; }
function renderFacilitator(){
  const rows = [...F.teams].sort((a,b)=>b.score-a.score || a.minutes-b.minutes);
  $("#app").innerHTML = `
  <div class="wrap fac">
    <section class="stack">
      <div class="panel stack" style="align-items:flex-start">
        <span class="label">Mission time remaining</span>
        <div class="clock" id="clock">${fmtTime(fRemaining()*1000)}</div>
        <div class="row">
          <button class="btn primary" id="fStart">${F.running?"Pause":"Start"}</button>
          <button class="btn" id="fAdd">+1 min</button>
          <button class="btn ghost" id="fReset">Reset to ${CONFIG.sessionMinutes} min</button>
        </div>
      </div>
      <div class="panel stack">
        <h3>Leaderboard</h3>
        <form class="row" id="fForm" style="align-items:flex-end">
          <div style="flex:1;min-width:140px"><label class="label" for="fTeam">Team name</label><input type="text" id="fTeam" maxlength="24" autocomplete="off"></div>
          <div style="flex:1;min-width:120px"><label class="label" for="fCode">Report code</label><input type="text" id="fCode" maxlength="9" autocomplete="off" spellcheck="false" placeholder="XXXX-XXX" style="font-family:var(--f-mono);text-transform:uppercase"></div>
          <button class="btn primary" type="submit">Add</button>
        </form>
        <div id="fMsg"></div>
        ${rows.length?`<div class="scroll" style="border:0"><table class="lb"><thead><tr><th>#</th><th>Team</th><th style="text-align:right">Stages</th><th style="text-align:right">Time</th><th style="text-align:right">Score</th><th></th></tr></thead>
        <tbody>${rows.map((r,k)=>`<tr><td class="num" style="text-align:left">${k+1}</td><td>${esc(r.team)}</td><td class="num">${STAGES.filter((_,b)=>r.mask&(1<<b)).length}/${STAGES.length}</td><td class="num">${r.minutes} min</td><td class="num">${r.score}</td><td style="text-align:right"><button class="btn ghost" data-del="${esc(r.id)}" aria-label="Remove ${esc(r.team)}">✕</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">Teams show a seven-character report code when they finish. Enter it here with their team name. Codes include a checksum, so mistyped or made-up codes are rejected.</p>`}
      </div>
    </section>
    <section class="stack">
      <div class="panel stack">
        <h3>One-hour run sheet</h3>
        <ol class="runsheet">
          <li><span class="when">0–5 min</span><span>Welcome and brief. Form teams of 3–5 with one laptop or tablet each. Read the start screen together and explain scoring.</span></li>
          <li><span class="when">5–50 min</span><span>Mission. Start the countdown. Circulate and nudge teams towards the in-app hints rather than giving answers. Announce at 30, 15 and 5 minutes left.</span></li>
          <li><span class="when">50–53 min</span><span>Collect report codes and reveal the leaderboard.</span></li>
          <li><span class="when">53–60 min</span><span>Debrief using the prompts below, then link each stage to a career and a course.</span></li>
        </ol>
        <p class="small muted">Pacing: about 5 minutes per stage. By 25 minutes most teams should be on stage 5. Fast teams may finish early and slower teams may not reach stage 9, so the leaderboard ranks by score first and time second. If most teams are stuck on one stage, pause the room and walk through its first hint together.</p>
      </div>
      <div class="panel">
        <h3 style="margin-bottom:.4rem">Debrief prompts</h3>
        <details class="prompt"><summary>Phishing</summary><p>Why was this email well written, with a real logo? What could Dan have checked in five seconds? Why do companies say they will never ask for your password?</p></details>
        <details class="prompt"><summary>Logs and MFA</summary><p>Why did Dan press Approve? Have you ever tapped a notification just to make it go away? What else in the log looked alarming but turned out to be noise?</p></details>
        <details class="prompt"><summary>Cryptography</summary><p>What is the difference between encoding and encryption? Why is a Caesar cipher so easy to break? What do we actually use today (AES, RSA), and why is frequency analysis useless against them?</p></details>
        <details class="prompt"><summary>Secure code</summary><p>Every flaw here was a single line. Why do developers make these mistakes? Who reviews code in a real company? Why is "hide it" never a security fix?</p></details>
        <details class="prompt"><summary>Timeline</summary><p>Why do police and insurers need exact times? What would have happened if Dan had reported the sign-in alert at 08:04? How could the company shrink a 59-minute window?</p></details>
        <details class="prompt"><summary>Passwords and hashing</summary><p>If hashing is one-way, how does a website check your password? Why did two staff choose the same password? Is a long passphrase really better than a short complex one?</p></details>
        <details class="prompt"><summary>Firewall</summary><p>Why does rule order matter? What else is on the internet trying to connect to your home router right now? Why are firewalls only one layer of defence?</p></details>
        <details class="prompt"><summary>Machine learning</summary><p>What's the cost of a missed attack compared with a false alarm, and who decides? Could a model trained on last year's attacks miss next year's? Where else is this trade-off made, for example in medical screening or spam filters?</p></details>
        <details class="prompt"><summary>Response</summary><p>Why is blaming Dan a bad idea, even though he clicked? Who else would a real company need to tell (bank, police, insurer, possibly the ICO)? What would you do first if this were your school?</p></details>
      </div>
      <p class="small muted"><a href="#">← Back to the team view</a></p>
    </section>
  </div>`;
  $("#fStart").onclick=()=>{ if(F.running){ F.remaining=fRemaining(); F.running=false; } else { F.endAt=Date.now()+F.remaining*1000; F.running=true; } saveF(); renderFacilitator(); };
  $("#fAdd").onclick=()=>{ if(F.running) F.endAt+=60000; else F.remaining+=60; saveF(); updClock(); };
  $("#fReset").onclick=()=>{ F.running=false; F.remaining=CONFIG.sessionMinutes*60; saveF(); renderFacilitator(); };
  $("#fForm").onsubmit=e=>{
    e.preventDefault();
    const team=$("#fTeam").value.trim(), r=readCode($("#fCode").value);
    if(!team){ $("#fMsg").innerHTML=`<div class="feedback info">Enter the team name.</div>`; return; }
    if(!r){ $("#fMsg").innerHTML=`<div class="feedback bad">That code isn't valid. Check it with the team and try again.</div>`; return; }
    F.teams=F.teams.filter(t=>t.team.toLowerCase()!==team.toLowerCase());
    F.teams.push({id:Date.now().toString(36), team, ...r}); saveF(); renderFacilitator();
    $("#fTeam").focus();
  };
  $("#app").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ F.teams=F.teams.filter(t=>t.id!==b.dataset.del); saveF(); renderFacilitator(); });
  function updClock(){ const c=$("#clock"); if(!c) return; const r=fRemaining(); c.textContent=fmtTime(r*1000); c.classList.toggle("low", r<=300 && r>0 || r===0); }
  clearInterval(fTick); fTick=setInterval(()=>{ if(route!=="fac"){ clearInterval(fTick); return; } updClock(); if(F.running && fRemaining()===0){ F.running=false; F.remaining=0; saveF(); renderFacilitator(); } },500);
  updClock();
}

render(); if(S.started && !S.finished) startTick();
</script>

</body>
</html>
